# Tutorix — Docker Compose for EC2 (API + tutor web + admin web)
#
#   docker compose up -d --build
#
# Tutor UI:  127.0.0.1:8080  → host nginx (e.g. dev.tutorix.tech)
# Admin UI:  127.0.0.1:81    → host nginx (e.g. dev-admin.tutorix.tech)
# GraphQL:   /api/graphql on each SPA (proxied to the api container)
#
# TLS reverse proxy: docker/nginx/host-ec2-reverse-proxy.conf.example
# Env template:      .env.docker.example
# JWT / DB user / Anthropic / Firebase JSON / production Razorpay: Secrets Manager

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      # Process (Compose always runs the API as production Node)
      NODE_ENV: production
      PORT: '3000'
      # Environment / Secrets Manager
      TUTORIX_ENV: ${TUTORIX_ENV:-}
      AWS_SECRET_NAME: ${AWS_SECRET_NAME:-tutorix/app}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # Public URLs / CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Database (user/password from Secrets Manager)
      DB_HOST: ${DOCKER_DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-tutorix}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      AUTO_RUN_MIGRATIONS: ${AUTO_RUN_MIGRATIONS:-false}
      # Maps
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Payments
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_CHECKOUT_THEME_COLOR: ${RAZORPAY_CHECKOUT_THEME_COLOR:-}
      RAZORPAY_CHECKOUT_LOGO_URL: ${RAZORPAY_CHECKOUT_LOGO_URL:-}
      PAYMENT_SETTLEMENT_BATCH_ENABLED: ${PAYMENT_SETTLEMENT_BATCH_ENABLED:-}
      PAYMENT_SETTLEMENT_BATCH_CRON: ${PAYMENT_SETTLEMENT_BATCH_CRON:-}
      PAYMENT_SETTLEMENT_BATCH_LIMIT: ${PAYMENT_SETTLEMENT_BATCH_LIMIT:-}
      # Document screening (ANTHROPIC_API_KEY from Secrets Manager)
      ANTHROPIC_DOCUMENT_SCREENING_MODEL: ${ANTHROPIC_DOCUMENT_SCREENING_MODEL:-}
      DOCUMENT_SCREENING_BATCH_ENABLED: ${DOCUMENT_SCREENING_BATCH_ENABLED:-}
      DOCUMENT_SCREENING_BATCH_CRON: ${DOCUMENT_SCREENING_BATCH_CRON:-}
      DOCUMENT_SCREENING_BATCH_LIMIT: ${DOCUMENT_SCREENING_BATCH_LIMIT:-}
      DOCUMENT_SCREENING_CONFIDENCE_THRESHOLD: ${DOCUMENT_SCREENING_CONFIDENCE_THRESHOLD:-}
      # Tutor onboarding approval
      TUTOR_APPROVAL_BATCH_ENABLED: ${TUTOR_APPROVAL_BATCH_ENABLED:-}
      TUTOR_APPROVAL_BATCH_CRON: ${TUTOR_APPROVAL_BATCH_CRON:-}
      TUTOR_APPROVAL_BATCH_LIMIT: ${TUTOR_APPROVAL_BATCH_LIMIT:-}
      # S3 documents (omit ACCESS_KEY_* on EC2; use instance role)
      S3_DOCUMENTS_BUCKET: ${S3_DOCUMENTS_BUCKET:-}
      S3_DOCUMENTS_BUCKET_REGION: ${S3_DOCUMENTS_BUCKET_REGION:-}
      DOCUMENT_PUBLIC_BASE_URL: ${DOCUMENT_PUBLIC_BASE_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Email (AWS SES)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      SES_FROM_NAME: ${SES_FROM_NAME:-}
      SES_REGION: ${SES_REGION:-}
      # Firebase (Admin JSON from Secrets Manager)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:-}
        VITE_GRAPHQL_ENDPOINT: ${VITE_GRAPHQL_ENDPOINT:-/api/graphql}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GEOAPIFY_API_KEY: ${VITE_GEOAPIFY_API_KEY:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    ports:
      - '127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        VITE_GRAPHQL_ENDPOINT: ${VITE_GRAPHQL_ENDPOINT:-/api/graphql}
    ports:
      - '127.0.0.1:${ADMIN_HTTP_PORT:-81}:80'
    depends_on:
      api:
        condition: service_healthy
