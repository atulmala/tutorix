apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Some third-party native modules (e.g. react-native-keychain) look up this
// legacy extension property on the :app project (not rootProject) to find
// react-native's location instead of using the standard autolinking config.
ext {
    REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    reactNativeDir = file("../../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    cliFile = file("../../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    entryFile = file("../../src/main.tsx")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    // Resolved with cwd = apps/mobile (not android/app). Path is relative to
    // apps/mobile → workspace root node_modules (Nx monorepo layout).
    hermesCommand = "../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def tutorixLocalProperties = new Properties()
def tutorixLocalPropertiesFile = rootProject.file('local.properties')
if (tutorixLocalPropertiesFile.exists()) {
    tutorixLocalPropertiesFile.withInputStream { tutorixLocalProperties.load(it) }
}

def tutorixProp = { String name ->
    def fromEnv = System.getenv(name)
    if (fromEnv != null && !fromEnv.isEmpty()) {
        return fromEnv
    }
    def fromLocal = tutorixLocalProperties.getProperty(name)
    if (fromLocal != null && !fromLocal.isEmpty()) {
        return fromLocal
    }
    def fromProject = project.findProperty(name)
    return fromProject != null ? fromProject.toString() : null
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tutorix.tech"
    defaultConfig {
        applicationId "com.tutorix.tech"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def uploadStoreFile = tutorixProp('TUTORIX_UPLOAD_STORE_FILE')
            def uploadStorePassword = tutorixProp('TUTORIX_UPLOAD_STORE_PASSWORD')
            def uploadKeyAlias = tutorixProp('TUTORIX_UPLOAD_KEY_ALIAS')
            def uploadKeyPassword = tutorixProp('TUTORIX_UPLOAD_KEY_PASSWORD')
            if (uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    // Agora RTC and RTM both ship libaosl.so; keep one copy per ABI.
    packaging {
        jniLibs {
            pickFirsts += ['**/libaosl.so']
        }
    }
}

// pickFirsts can keep RTM's bundled libaosl.so, which is older than the
// io.agora.infra:aosl that RTC depends on. RTC then never connects (no audio
// or video), so overwrite the merged copy with RTC's version.
android.applicationVariants.all { variant ->
    def mergeTaskName = "merge${variant.name.capitalize()}NativeLibs"
    tasks.matching { it.name == mergeTaskName }.configureEach { task ->
        task.doLast {
            def aosl = configurations.getByName("${variant.name}RuntimeClasspath")
                .incoming.resolutionResult.allComponents
                .collect { it.moduleVersion }
                .find { it != null && it.group == 'io.agora.infra' && it.name == 'aosl' }
            if (aosl == null) {
                return
            }
            def aar = configurations
                .detachedConfiguration(dependencies.create("io.agora.infra:aosl:${aosl.version}@aar"))
                .singleFile
            def libDir = task.outputDir.get().dir('lib').asFile
            copy {
                from(zipTree(aar)) {
                    include 'jni/*/libaosl.so'
                    eachFile { details ->
                        details.path = details.path.replaceFirst('^jni/', '')
                        if (!new File(libDir, details.path).exists()) {
                            details.exclude()
                        }
                    }
                }
                includeEmptyDirs = false
                into libDir
            }
            logger.lifecycle("Packaged libaosl.so from io.agora.infra:aosl:${aosl.version} for ${variant.name}")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Apply Google Services plugin for Firebase
apply plugin: 'com.google.gms.google-services'
// Apply Crashlytics plugin for Firebase Crashlytics
apply plugin: 'com.google.firebase.crashlytics'
